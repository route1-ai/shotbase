# plugin-scanner configuration
#
# lists/*.bin are compiled ad and popup domain blocklists, generated by
# scripts/build-blocklists.mjs from Ghostery's prebuilt ads+tracking list
# and EasyList Cookie List / Fanboy's Annoyance List, and loaded at runtime
# by the request blocker. They are binary data; their byte sequences trip
# entropy-based secret detection. No credential material is present.
#
# Nothing else is excluded. src/, test/, docs/ and all configuration are
# scanned in full.

[scanner]
ignore_paths = ["lists/*"]
