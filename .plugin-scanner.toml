# plugin-scanner configuration
#
# lists/*.bin are compiled ad and popup domain blocklists, generated by
# scripts/build-blocklists.mjs and loaded at runtime by the request blocker.
# They are binary data; their byte sequences trip entropy-based secret
# detection. No credential material is present in them.
#
# Nothing else is excluded. src/, test/, docs/ and all configuration are
# scanned in full.
ignore_paths = ["lists/*"]
